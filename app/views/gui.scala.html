@()

@main("Minesweeper SPA") {
  <link rel="stylesheet" href='@routes.Assets.versioned("stylesheets/main.css")'>
  <script src="https://code.jquery.com/jquery-3.7.0.min.js"></script>
  <script src='@routes.Assets.versioned("javascripts/minesweeper_spa.js")'></script>

  <div id="app">
    <header>
      <h1>Minesweeper</h1>
    </header>

    <div id="controls" class="mb-3">
      <button id="easy" class="btn">Easy</button>
      <button id="medium" class="btn">Medium</button>
      <button id="hard" class="btn">Hard</button>

      <button id="undo" class="btn">Undo</button>
      <button id="restart" class="btn">Restart</button>
      <button id="saveGame" class="btn">Save</button>
      <button id="loadGamePage" class="btn">Load page</button>
    </div>

    <div id="gameArea">
      <div id="gameBoard"></div>
    </div>
  </div>
}
